# Run the whole stack locally: docker-compose up --build
version: '3.9'
services:
  mongo_db:
    image: mongo:latest
    ports: ["27017:27017"]
    restart: always
    volumes: [mongo_data:/data/db]
  api:
    build: ./server/database
    ports: ["3030:3030"]
    depends_on: [mongo_db]
  sentiment:
    build: ./server/djangoapp/microservices
    ports: ["5050:5000"]
  web:
    build: ./server
    ports: ["8000:8000"]
    environment:
      backend_url: http://api:3030
      sentiment_analyzer_url: http://sentiment:5000/
      DJANGO_SUPERUSER_USERNAME: root
      DJANGO_SUPERUSER_PASSWORD: root1234
      DJANGO_SUPERUSER_EMAIL: root@example.com
    depends_on: [api, sentiment]
volumes:
  mongo_data: {}
